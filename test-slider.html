<!DOCTYPE html>
<html>
<head>
<style>
  .flex-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 256px;
    background: #ccc;
  }
  .slider {
    width: 256px;
    height: 4px;
    transform: rotate(-90deg);
  }
  .slider-shrink {
    width: 256px;
    height: 4px;
    transform: rotate(-90deg);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="flex-container">
    <input type="range" class="slider" />
  </div>
  <br/>
  <div class="flex-container">
    <input type="range" class="slider-shrink" />
  </div>
</body>
</html>
